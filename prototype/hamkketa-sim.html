<title>함께타 모빌리티</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* 레이아웃: 상단 고정 헤더(탭) + 단일 열 그리드 본문. 휴대폰(≤760px)은 한 줄 앱 바 + 메뉴판 */
:root{
  --color-background-body:#F3F5F8; --color-background-surface:#FFFFFF; --color-background-card:#FFFFFF; --color-background-popover:#FFFFFF;
  --color-text-primary:#1C2B33; --color-text-secondary:#5B6B7A; --color-text-accent:#0057C2;
  --color-accent:#0064E0; --color-accent-muted:#E6F0FD; --color-on-accent:#FFFFFF;
  --color-border:#DCE2E9; --color-thead:#F1F4F8; --color-hover:#F6F9FC;
  --color-info:#0064E0; --color-info-muted:#E6F0FD;
  --color-success:#1E8E3E; --color-success-muted:#E5F4EA;
  --color-warning:#9A6400; --color-warning-muted:#FFF4D6;
  --color-error:#D11A38; --color-error-muted:#FDE8EC;
  --map-land:#EEF2EC; --map-road:#FFFFFF; --map-road-edge:#D5DBD3; --map-river:#BFD8F2; --map-park:#DCEBD6;
  --spacing-1:4px; --spacing-2:8px; --spacing-3:12px; --spacing-4:16px; --spacing-5:20px; --spacing-6:24px; --spacing-7:28px; --spacing-8:32px;
  --shadow-low:0 1px 2px rgba(16,32,52,.06),0 1px 1px rgba(16,32,52,.04);
  --shadow-med:0 4px 12px rgba(16,32,52,.08),0 1px 3px rgba(16,32,52,.06);
  --shadow-high:0 16px 40px rgba(16,32,52,.18),0 2px 8px rgba(16,32,52,.08);
  --overlay:rgba(14,22,32,.42);
  --font:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --bg:var(--color-background-body); --accent:var(--color-accent);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --color-background-body:#0E1318; --color-background-surface:#161D24; --color-background-card:#1B232C; --color-background-popover:#212A34;
  --color-text-primary:#E5E9EE; --color-text-secondary:#A2AFBC; --color-text-accent:#5EA6FF;
  --color-accent:#0171E3; --color-accent-muted:#13304F; --color-on-accent:#FFFFFF;
  --color-border:#2C3743; --color-thead:#1F2832; --color-hover:#202A35;
  --color-info:#5EA6FF; --color-info-muted:#13304F;
  --color-success:#5CCB7C; --color-success-muted:#16301F;
  --color-warning:#F2C04B; --color-warning-muted:#33290F;
  --color-error:#FF6B81; --color-error-muted:#3A1820;
  --map-land:#1A2320; --map-road:#2A3440; --map-road-edge:#222B35; --map-river:#173452; --map-park:#1C2E22;
  --shadow-low:0 1px 2px rgba(0,0,0,.4); --shadow-med:0 4px 14px rgba(0,0,0,.45); --shadow-high:0 16px 40px rgba(0,0,0,.6);
  --overlay:rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --color-background-body:#0E1318; --color-background-surface:#161D24; --color-background-card:#1B232C; --color-background-popover:#212A34;
  --color-text-primary:#E5E9EE; --color-text-secondary:#A2AFBC; --color-text-accent:#5EA6FF;
  --color-accent:#0171E3; --color-accent-muted:#13304F; --color-on-accent:#FFFFFF;
  --color-border:#2C3743; --color-thead:#1F2832; --color-hover:#202A35;
  --color-info:#5EA6FF; --color-info-muted:#13304F;
  --color-success:#5CCB7C; --color-success-muted:#16301F;
  --color-warning:#F2C04B; --color-warning-muted:#33290F;
  --color-error:#FF6B81; --color-error-muted:#3A1820;
  --map-land:#1A2320; --map-road:#2A3440; --map-road-edge:#222B35; --map-river:#173452; --map-park:#1C2E22;
  --shadow-low:0 1px 2px rgba(0,0,0,.4); --shadow-med:0 4px 14px rgba(0,0,0,.45); --shadow-high:0 16px 40px rgba(0,0,0,.6);
  --overlay:rgba(0,0,0,.6); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--color-background-body);color:var(--color-text-primary);font:14px/1.45 var(--font);-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--color-background-surface)}
h1,h2,h3{margin:0;line-height:1.2;text-wrap:balance}
h1{font-size:20px;font-weight:700} h2{font-size:16.8px;font-weight:700} h3{font-size:14px;font-weight:700}
p{margin:0}
.muted{color:var(--color-text-secondary)} .small{font-size:12px}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.row{display:flex;gap:var(--spacing-2);align-items:center;flex-wrap:wrap}
.row.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:var(--spacing-3)}
.grid{display:grid;gap:var(--spacing-4);grid-template-columns:repeat(auto-fit,minmax(min(300px,100%),1fr))}
.grid>*{min-width:0}

/* 버튼 */
.btn{appearance:none;border:1px solid var(--color-border);background:var(--color-background-surface);color:var(--color-text-primary);
  font:inherit;font-weight:600;border-radius:8px;min-height:38px;padding:0 14px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.btn:hover{background:var(--color-hover)}
.btn:focus-visible,.tab:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.pin:focus-visible,.zone:focus-visible{outline:2px solid var(--color-accent);outline-offset:2px}
.btn.primary{background:var(--color-accent);border-color:var(--color-accent);color:var(--color-on-accent)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--color-text-accent)}
.btn.ghost:hover{background:var(--color-accent-muted)}
.btn.destructive{background:var(--color-error-muted);border-color:transparent;color:var(--color-error)}
.btn.sm{min-height:32px;padding:0 10px;font-size:12.5px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.block{width:100%}

/* 입력 */
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld>span{font-size:12px;font-weight:600;color:var(--color-text-secondary)}
input,select,textarea{font:inherit;color:var(--color-text-primary);background:var(--color-background-surface);border:1px solid var(--color-border);border-radius:8px;min-height:38px;padding:0 10px;width:100%;min-width:0}
textarea{padding:8px 10px;min-height:70px;resize:vertical}
.cols{display:grid;gap:var(--spacing-3);grid-template-columns:repeat(auto-fit,minmax(min(180px,100%),1fr))}
label.chk{display:flex;align-items:center;gap:8px;cursor:pointer}
label.chk input{width:18px;min-height:18px;height:18px}

/* 카드·배지·배너 */
.card{background:var(--color-background-card);border:1px solid var(--color-border);border-radius:12px;padding:var(--spacing-4);box-shadow:var(--shadow-low);min-width:0}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;border-radius:999px;padding:2px 8px;background:var(--color-thead);color:var(--color-text-secondary);white-space:nowrap}
.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.badge.info{background:var(--color-info-muted);color:var(--color-info)}
.badge.success{background:var(--color-success-muted);color:var(--color-success)}
.badge.warning{background:var(--color-warning-muted);color:var(--color-warning)}
.badge.error{background:var(--color-error-muted);color:var(--color-error)}
.badge.plain::before{display:none}
.banner{display:flex;gap:10px;align-items:flex-start;border-radius:8px;padding:10px 12px;font-size:13px;background:var(--color-info-muted);color:var(--color-text-primary)}
.banner .ic{flex:none;width:18px;height:18px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:800;color:var(--color-on-accent);background:var(--color-info)}
.banner.success{background:var(--color-success-muted)} .banner.success .ic{background:var(--color-success)}
.banner.warning{background:var(--color-warning-muted)} .banner.warning .ic{background:var(--color-warning)}
.banner.error{background:var(--color-error-muted)} .banner.error .ic{background:var(--color-error)}
.banner b{font-weight:700}
.kpi{background:var(--color-background-card);border:1px solid var(--color-border);border-radius:12px;padding:12px 14px}
.kpi .k{font-size:12px;color:var(--color-text-secondary);font-weight:600}
.kpi .v{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:2px}
.grid.k4{grid-template-columns:repeat(auto-fit,minmax(min(160px,100%),1fr))}

/* 헤더·탭 */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--color-background-surface);border-bottom:1px solid var(--color-border)}
header.top .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:6px 16px;padding-block:8px 0}
.brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:16px;letter-spacing:-.2px;padding-bottom:8px;min-width:0}
.brand svg{flex:none}
.brand small{font-weight:600;color:var(--color-text-secondary);font-size:11.5px;letter-spacing:.3px}
.tabs{display:flex;flex-wrap:wrap;gap:2px;flex:1 1 auto;min-width:0}
.tab{appearance:none;background:none;border:0;font:inherit;font-weight:600;color:var(--color-text-secondary);padding:10px 12px 12px;cursor:pointer;border-bottom:2px solid transparent;border-radius:0}
.tab:hover{color:var(--color-text-primary)}
.tab.on{color:var(--color-text-accent);border-bottom-color:var(--color-accent)}
.userbtns{display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding-bottom:8px}
.lang{display:inline-flex;border:1px solid var(--color-border);border-radius:8px;overflow:hidden}
.lang button{appearance:none;border:0;background:var(--color-background-surface);color:var(--color-text-secondary);font:inherit;font-size:12px;font-weight:700;padding:0 9px;min-height:30px;cursor:pointer}
.lang button.on{background:var(--color-accent);color:var(--color-on-accent)}
.menubtn{display:none}
main{display:grid;grid-template-columns:minmax(0,1fr);gap:var(--spacing-4);padding-block:var(--spacing-4) 48px}
main>*{min-width:0}

/* 하위 메뉴 (SegmentedControl) */
.seg{display:inline-flex;gap:2px;background:var(--color-thead);border:1px solid var(--color-border);border-radius:10px;padding:3px;flex-wrap:wrap}
.seg button{appearance:none;border:0;background:none;font:inherit;font-weight:600;color:var(--color-text-secondary);padding:6px 14px;border-radius:7px;cursor:pointer;min-height:32px}
.seg button.on{background:var(--color-background-surface);color:var(--color-text-primary);box-shadow:var(--shadow-low)}

/* 표 */
.tw{width:100%}
.tw.xw{overflow-x:auto}
.tw.xw th{position:static}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th,td{padding:5px 6px;border-bottom:1px solid var(--color-border);text-align:left;vertical-align:middle}
th{background:var(--color-thead);font-weight:700;color:var(--color-text-secondary);font-size:12px}
tbody tr:hover td{background:var(--color-hover)}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;padding:4px}
td select{min-height:30px;font-size:12.5px;padding:0 4px;width:auto}
@media (max-width:1200px){th,td{padding:3px;font-size:11.5px}}

/* 지도 */
.mapbox{position:relative;border-radius:10px;overflow:hidden;border:1px solid var(--color-border);background:var(--map-land)}
.mapbox svg{display:block;width:100%;height:auto}
.pin{cursor:pointer}
.pin circle.dot{fill:var(--color-background-surface);stroke:var(--color-accent);stroke-width:2.5}
.pin text{font:700 11px var(--font);fill:var(--color-text-accent)}
.pin.on circle.dot{fill:var(--color-accent)}
.pin.on text{fill:var(--color-on-accent)}
.pin.none circle.dot{stroke:var(--color-text-secondary)} .pin.none text{fill:var(--color-text-secondary)}
.pin text.lbl{font:700 11px var(--font);fill:var(--color-text-primary);paint-order:stroke;stroke:var(--color-background-surface);stroke-width:4px;stroke-linejoin:round}
.zones{display:grid;gap:6px}
.zone{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:8px 10px;border:1px solid var(--color-border);border-radius:8px;cursor:pointer;background:var(--color-background-surface);text-align:left;font:inherit;color:inherit;width:100%}
.zone.on{border-color:var(--color-accent);background:var(--color-accent-muted)}

/* 차량 카드 */
.cars{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(min(250px,100%),1fr))}
.car{display:flex;flex-direction:column;gap:8px;border:1px solid var(--color-border);border-radius:12px;padding:12px;background:var(--color-background-card)}
.car .top{display:flex;gap:10px;align-items:center}
.car .ico{flex:none;width:52px;height:36px;border-radius:8px;background:var(--color-accent-muted);display:grid;place-items:center}
.car .price{font-size:17px;font-weight:800;font-variant-numeric:tabular-nums}
.meter{height:5px;border-radius:9px;background:var(--color-thead);overflow:hidden}
.meter i{display:block;height:100%;background:var(--color-success)}
.dl-list{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13px}
.dl-list dt{color:var(--color-text-secondary)} .dl-list dd{margin:0;text-align:right;font-variant-numeric:tabular-nums}
.dl-list .tot{font-weight:800;font-size:15px}
.key{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.key .btn{min-height:54px;flex-direction:column;gap:2px;font-size:12px}
.key .btn b{font-size:18px;line-height:1}

/* 카풀 */
.ride{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;border:1px solid var(--color-border);border-radius:12px;padding:12px;background:var(--color-background-card)}
.route{display:grid;grid-template-columns:12px minmax(0,1fr);gap:2px 8px;align-items:center}
.route i{width:9px;height:9px;border-radius:50%;border:2px solid var(--color-accent);justify-self:center}
.route i.e{background:var(--color-accent)}
.route .ln{width:2px;height:10px;background:var(--color-border);justify-self:center}
.time{font-weight:800;font-size:16px;font-variant-numeric:tabular-nums;text-align:center;min-width:56px}
.time small{display:block;font-weight:600;font-size:11px;color:var(--color-text-secondary)}
.avatar{width:28px;height:28px;border-radius:50%;background:var(--color-accent-muted);color:var(--color-text-accent);display:grid;place-items:center;font-weight:800;font-size:12px;flex:none}

/* 홈 */
.hero{display:grid;gap:var(--spacing-4);grid-template-columns:repeat(auto-fit,minmax(min(300px,100%),1fr))}
.entry{display:flex;gap:14px;align-items:center;text-align:left;font:inherit;color:inherit;cursor:pointer;border:1px solid var(--color-border);border-radius:12px;padding:18px;background:var(--color-background-card);box-shadow:var(--shadow-low)}
.entry:hover{box-shadow:var(--shadow-med)}
.entry .big{font-size:18px;font-weight:800}
.entry svg{flex:none}

/* 대화상자 */
.ov{position:fixed;inset:0;z-index:50;background:var(--overlay);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);display:grid;place-items:center;padding:16px}
.dl{background:var(--color-background-popover);border-radius:16px;box-shadow:var(--shadow-high);width:min(540px,100%);max-height:calc(100dvh - 32px);overflow:auto;display:flex;flex-direction:column}
.dl .hd{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:14px 16px;border-bottom:1px solid var(--color-border);position:sticky;top:0;background:var(--color-background-popover);z-index:1}
.dl .bd{padding:16px;display:flex;flex-direction:column;gap:12px}
.dl .ft{display:flex;gap:8px;justify-content:flex-end;padding:12px 16px;border-top:1px solid var(--color-border);flex-wrap:wrap}
.opt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--color-border);border-radius:8px;padding:10px;cursor:pointer}
.opt input{width:18px;min-height:18px;height:18px;margin-top:2px;flex:none}
.opt:has(input:checked){border-color:var(--color-accent);background:var(--color-accent-muted)}

/* 로딩·토스트 */
.loadbar{position:fixed;left:0;right:0;top:env(safe-area-inset-top,0px);height:3px;z-index:60;overflow:hidden;background:var(--color-accent-muted)}
.loadbar i{position:absolute;top:0;bottom:0;width:35%;background:var(--color-accent);animation:lb 1s ease-in-out infinite}
@keyframes lb{0%{left:-35%}100%{left:100%}}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));z-index:70;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;width:max-content;max-width:calc(100% - 32px)}
#toast div{background:var(--color-text-primary);color:var(--color-background-body);padding:10px 14px;border-radius:10px;font-weight:600;font-size:13px;box-shadow:var(--shadow-med)}
@media (prefers-reduced-motion:reduce){.loadbar i{animation:none;width:100%;left:0}}

/* 로그인 */
.auth{min-height:100dvh;display:grid;place-items:center;padding-block:24px}
.auth .card{width:min(400px,100%);padding:24px;display:flex;flex-direction:column;gap:14px}
.auth .logo{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.demo{font-size:12px;border:1px dashed var(--color-border);border-radius:8px;padding:8px 10px;color:var(--color-text-secondary)}
.demo code{font-family:ui-monospace,Menlo,Consolas,monospace;color:var(--color-text-primary)}
.mail{border:1px solid var(--color-border);border-radius:8px;padding:10px;font-size:12.5px;background:var(--color-thead)}
.mail .code{font-size:22px;font-weight:800;letter-spacing:4px;font-variant-numeric:tabular-nums}

/* 휴대폰 메뉴판 */
.sheet{position:fixed;inset:0;z-index:40;background:var(--overlay)}
.sheet .pn{background:var(--color-background-surface);border-radius:0 0 16px 16px;padding:calc(12px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px));box-shadow:var(--shadow-high);display:flex;flex-direction:column;gap:12px;animation:dn .18s ease-out}
@keyframes dn{from{transform:translateY(-16px);opacity:0}to{transform:none;opacity:1}}
.sheet .m2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sheet .m2 .tab{min-height:44px;border:1px solid var(--color-border);border-radius:8px;padding:0 12px;text-align:left}
.sheet .m2 .tab.on{background:var(--color-accent-muted);border-color:var(--color-accent)}
.sheet .m3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
body.lock{overflow:hidden}

@media (max-width:760px){
  header.top .wrap{flex-wrap:nowrap;padding-block:0;min-height:52px;gap:8px}
  header.top .tabs,header.top .userbtns .acct{display:none}
  header.top .userbtns{padding-bottom:0;flex-wrap:nowrap}
  .brand{padding-bottom:0;flex:1 1 auto;overflow:hidden}
  .brand .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .brand small{display:none}
  .menubtn{display:inline-flex}
  main>.row.between{flex-direction:column;align-items:stretch}
  main>.row.between>.row .fld{flex:1 1 140px}
  main>.row.between>.row .btn:not(.sm){flex:1 1 auto}
  .seg{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr))}
  .grid:has(>.kpi){grid-template-columns:1fr 1fr}
  .kpi .v{font-size:18px}
  .cols{grid-template-columns:1fr 1fr}
  .tw.xw td,.tw.xw th{white-space:nowrap}
  .tw.xw .c0{position:sticky;left:0;top:auto;background:var(--color-background-card);z-index:1}
  .tw.xw th.c0{background:var(--color-thead)}
  .ov{padding:0}
  .dl{width:100%;min-height:100dvh;max-height:100dvh;border-radius:0}
  .dl .ft{position:sticky;top:57px;order:-1;border-top:0;border-bottom:1px solid var(--color-border);background:var(--color-background-popover);z-index:1}
  .btn{min-height:38px} .btn.sm{min-height:32px}
  input,select,textarea{font-size:16px}
  td input,td select{font-size:14px}
  .loadbar{top:auto;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:50%;right:auto;width:120px;transform:translateX(-50%);border-radius:9px;height:5px}
  .ride{grid-template-columns:auto minmax(0,1fr)}
  .ride>.act{grid-column:1/-1}
  .ride>.act .btn{width:100%}
}
@media (max-width:480px){ .cols{grid-template-columns:1fr} }
</style>

<div id="bar" class="loadbar" hidden><i></i></div>
<div id="app"></div>
<div id="dlg"></div>
<div id="toast" aria-live="polite"></div>

<script>
(function(){
'use strict';

/* 모의 해시: 솔트+페퍼+2000회 반복 (실제 GAS에서는 Utilities.computeDigest SHA-256 반복) */
function hash(pw,salt){var a=0x811c9dc5,b=0x9e3779b9,s=salt+'|'+PEPPER+'|'+pw;for(var r=0;r<2000;r++){for(var i=0;i<s.length;i++){var c=s.charCodeAt(i);a=Math.imul(a^c,16777619)>>>0;b=Math.imul(b^(c+r),2246822507)>>>0}a=(a^(b>>>7))>>>0}return a.toString(16).padStart(8,'0')+b.toString(16).padStart(8,'0')}
